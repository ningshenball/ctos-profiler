<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ctOS Profiler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: "#070809",
                        panel: "#101214",
                        line: "#1c2124",
                        ink: "#e8e4dc",
                        mute: "#8b938e",
                        sage: "#7ea392",
                        warn: "#c4a574",
                        high: "#c45c4a",
                    },
                    fontFamily: {
                        sans: ["IBM Plex Sans", "sans-serif"],
                        mono: ["IBM Plex Mono", "monospace"],
                    },
                },
            },
        };
    </script>
    <style>
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(126, 163, 146, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(126, 163, 146, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body>* {
            position: relative;
            z-index: 1;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            20% {
                opacity: 0.35;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .scanline {
            pointer-events: none;
            position: fixed;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(126, 163, 146, 0.12), transparent);
            animation: scanline 2.8s linear infinite;
            z-index: 50;
        }

        @keyframes pulse-sage {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(126, 163, 146, 0.45);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(126, 163, 146, 0);
            }
        }

        .is-running #scanBtn {
            background: #7ea392;
            color: #070809;
            animation: pulse-sage 1.2s ease-out infinite;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-enter {
            animation: card-in 0.35s ease-out both;
        }

        @keyframes drawer-in {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        #drawer.open {
            animation: drawer-in 0.25s ease-out;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.idle {
            background: #8b938e;
        }

        .status-dot.running {
            background: #7ea392;
        }

        .status-dot.done {
            background: #7ea392;
        }

        .status-dot.error {
            background: #c45c4a;
        }

        #log {
            max-height: 220px;
            overflow-y: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
        }
    </style>
</head>

<body class="bg-void text-ink font-sans min-h-screen">
    <div id="scanline" class="hidden scanline"></div>
    <div class="max-w-6xl mx-auto px-6 py-10">
        <header class="flex items-end justify-between border-b border-line pb-6 mb-8">
            <div>
                <p class="font-mono text-xs tracking-[0.35em] text-sage uppercase">Blume / local node</p>
                <h1 class="text-3xl font-semibold tracking-tight mt-1">ctOS Profiler</h1>
                <p class="text-mute text-sm mt-1">Beta v1.1 — authorized LAN visibility only</p>
            </div>
            <div class="flex items-center">
                <span id="statusDot" class="status-dot idle"></span>
                <span id="status" class="font-mono text-xs text-mute">idle</span>
            </div>
        </header>

        <section class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-panel border border-line p-5">
                <p class="font-mono text-[11px] text-mute uppercase tracking-widest mb-3">Authorization gate</p>
                <label class="block text-xs text-mute mb-1">CIDR</label>
                <input id="cidr" placeholder="192.168.1.0/24"
                    class="w-full bg-void border border-line px-3 py-2 font-mono text-sm outline-none focus:border-sage" />
                <label class="flex items-start gap-2 mt-4 text-sm text-mute">
                    <input id="auth" type="checkbox" class="mt-1 accent-sage" />
                    <span>I own this network or have written authorization to scan it.</span>
                </label>
                <p class="text-xs text-warn mt-3">Real scan = ping + ARP + short TCP on a private /24 you own.</p>
            </div>
            <div class="bg-panel border border-line p-5">
                <p class="font-mono text-[11px] text-mute uppercase tracking-widest mb-3">Session</p>
                <p class="text-sm text-mute mb-4">S scan · D demo · Esc close drawer</p>
                <div class="flex flex-wrap gap-2">
                    <button id="scanBtn" type="button" class="px-3 py-2 bg-line text-mute text-sm">Scan</button>
                    <button id="cancelBtn" type="button"
                        class="px-3 py-2 border border-line text-mute text-sm">Cancel</button>
                    <button id="demoBtn" type="button" class="px-3 py-2 bg-sage text-void text-sm font-medium">Demo
                        data</button>
                    <a id="exportBtn" href="/api/export" class="px-3 py-2 border border-sage text-sage text-sm">Export
                        JSON</a>
                </div>
                <p id="err" class="text-xs text-high mt-3"></p>
            </div>
        </section>

        <section class="flex flex-wrap gap-2 mb-4">
            <input id="q" placeholder="filter ip / hostname / vendor"
                class="flex-1 min-w-[180px] bg-void border border-line px-3 py-2 font-mono text-sm outline-none focus:border-sage" />
            <select id="sortBy" class="bg-void border border-line px-3 py-2 font-mono text-sm">
                <option value="score">sort: score</option>
                <option value="ip">sort: ip</option>
                <option value="level">sort: risk</option>
            </select>
            <select id="levelFilter" class="bg-void border border-line px-3 py-2 font-mono text-sm">
                <option value="">all risk</option>
                <option value="high">high</option>
                <option value="medium">medium</option>
                <option value="low">low</option>
            </select>
        </section>

        <section id="stats" class="hidden mb-6 flex flex-wrap gap-4 text-sm font-mono">
            <span class="text-mute">nodes <b id="statNodes" class="text-ink">0</b></span>
            <span class="text-sage">low <b id="statLow">0</b></span>
            <span class="text-warn">med <b id="statMed">0</b></span>
            <span class="text-high">high <b id="statHigh">0</b></span>
        </section>

        <section id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
        <p id="empty" class="text-mute text-sm mt-2">No nodes. Load demo or run a scan.</p>
        <section id="log" class="mt-8 bg-panel border border-line p-4 font-mono text-xs text-mute leading-6"></section>
    </div>

    <div id="backdrop" class="hidden fixed inset-0 bg-void/60 z-[8]"></div>
    <aside id="drawer"
        class="hidden fixed inset-y-0 right-0 w-full max-w-md bg-panel border-l border-line overflow-y-auto z-10">
        <div class="px-6 py-4 border-b border-line flex justify-between">
            <p class="font-mono text-[10px] text-sage uppercase tracking-widest">Profile</p>
            <button id="closeDrawer" class="text-mute text-sm">close</button>
        </div>
        <div id="drawerBody" class="px-6 py-5"></div>
    </aside>

    <script>
        const edgeCls = { low: "border-l-sage", medium: "border-l-warn", high: "border-l-high" };
        const badgeCls = {
            low: "border-line text-mute",
            medium: "border-warn text-warn",
            high: "border-high text-high",
        };
        let timer = null;
        let lastState = { hosts: [], status: "idle", log: [] };

        async function getState() {
            const r = await fetch("/api/state");
            return r.json();
        }

        function esc(str) {
            const el = document.createElement("span");
            el.textContent = str || "";
            return el.innerHTML;
        }

        function setRunning(on) {
            document.body.classList.toggle("is-running", on);
            document.getElementById("scanline").classList.toggle("hidden", !on);
            document.getElementById("scanBtn").innerHTML = on
                ? '<span class="spinner"></span>Profiling…'
                : "Scan";
        }

        function visibleHosts(hosts) {
            const q = (document.getElementById("q").value || "").toLowerCase();
            const lf = document.getElementById("levelFilter").value;
            const sortBy = document.getElementById("sortBy").value;
            const rank = { high: 0, medium: 1, low: 2 };
            let list = (hosts || []).filter((h) => {
                if (lf && h.level !== lf) return false;
                const blob = `${h.ip} ${h.hostname || ""} ${h.vendor || ""}`.toLowerCase();
                return !q || blob.includes(q);
            });
            list = list.slice().sort((a, b) => {
                if (sortBy === "ip") return a.ip.localeCompare(b.ip, undefined, { numeric: true });
                if (sortBy === "level") return (rank[a.level] ?? 9) - (rank[b.level] ?? 9);
                return (b.score || 0) - (a.score || 0);
            });
            return list;
        }

        function render(state) {
            lastState = state;
            const status = state.status || "idle";
            document.getElementById("status").textContent = status;
            document.getElementById("statusDot").className = "status-dot " + status;
            setRunning(status === "running");
            document.getElementById("log").innerHTML = (state.log || []).map((l) => `<p>${esc(l)}</p>`).join("");

            const all = state.hosts || [];
            const hosts = visibleHosts(all);
            const stats = document.getElementById("stats");
            if (!all.length) stats.classList.add("hidden");
            else {
                stats.classList.remove("hidden");
                document.getElementById("statNodes").textContent = all.length;
                document.getElementById("statLow").textContent = all.filter((h) => h.level === "low").length;
                document.getElementById("statMed").textContent = all.filter((h) => h.level === "medium").length;
                document.getElementById("statHigh").textContent = all.filter((h) => h.level === "high").length;
            }

            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            document.getElementById("empty").style.display = hosts.length ? "none" : "block";

            hosts.forEach((h, i) => {
                const el = document.createElement("article");
                el.className = `card-enter bg-panel border border-line border-l-2 ${edgeCls[h.level] || "border-l-line"} p-4 cursor-pointer`;
                el.style.animationDelay = Math.min(i, 8) * 0.05 + "s";
                const flags = [
                    h.flag === "new" ? '<span class="text-[10px] font-mono text-sage">NEW</span>' : "",
                    h.flag === "changed" ? '<span class="text-[10px] font-mono text-warn">CHANGED</span>' : "",
                    h.mac_peers > 1 ? `<span class="text-[10px] font-mono text-mute">same MAC ×${h.mac_peers}</span>` : "",
                ].join(" ");
                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <p class="font-mono text-lg">${esc(h.ip)}</p>
                        <span class="text-[10px] font-mono uppercase ${h.is_self ? "text-sage" : "text-mute"}">${h.is_self ? "you" : "node"}</span>
                    </div>
                    <p class="text-xs text-mute mt-1">hostname · ${esc(h.hostname) || "—"}</p>
                    <p class="font-mono text-xs text-mute mt-3">${esc(h.mac) || "—"}</p>
                    <p class="text-xs text-mute">vendor · ${esc(h.vendor) || "—"}</p>
                    <p class="text-xs text-mute">os · ${esc(h.os_guess) || "—"}</p>
                    <div class="mt-2 flex flex-wrap gap-2">${flags}</div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="text-[10px] font-mono uppercase px-2 py-1 border ${badgeCls[h.level] || ""}">${esc(h.level)}</span>
                        <span class="font-mono text-xs text-mute">${(h.ports || []).map((p) => p.port).join(" ") || "—"}</span>
                    </div>`;
                el.onclick = () => openProfile(h);
                grid.appendChild(el);
            });

            if (status === "running") startPoll();
            else stopPoll();
        }

        function openProfile(h) {
            const drawer = document.getElementById("drawer");
            const backdrop = document.getElementById("backdrop");
            drawer.classList.remove("hidden");
            drawer.classList.add("open");
            backdrop.classList.remove("hidden");
            const ports = (h.ports || []).map((p) => `<li class="font-mono">${p.port} ${esc(p.name)}</li>`).join("");
            const reasons = (h.reasons || []).map((r) => `<li>${esc(r)}</li>`).join("");
            document.getElementById("drawerBody").innerHTML = `
                <h2 class="font-mono text-2xl">${esc(h.ip)}</h2>
                <p class="text-sm text-mute mt-2">${esc(h.hostname) || "—"} · ${esc(h.vendor) || "—"}</p>
                <p class="text-xs text-mute mt-1">${esc(h.os_guess) || "os unknown"}${h.ttl ? " · ttl " + h.ttl : ""}</p>
                <p class="font-mono text-xs text-mute mt-2">${esc(h.mac) || "—"}</p>
                <p class="mt-4 text-[10px] font-mono uppercase px-2 py-1 inline-block border ${badgeCls[h.level] || ""}">${esc(h.level)} · ${h.score}</p>
                <p class="mt-6 text-xs text-mute uppercase">ports</p>
                <ul class="mt-2 text-sm space-y-1">${ports || "<li>—</li>"}</ul>
                <p class="mt-6 text-xs text-mute uppercase">reasons</p>
                <ul class="mt-2 text-sm space-y-1">${reasons || "<li>—</li>"}</ul>`;
        }

        function closeDrawer() {
            document.getElementById("drawer").classList.add("hidden");
            document.getElementById("drawer").classList.remove("open");
            document.getElementById("backdrop").classList.add("hidden");
        }

        function startPoll() {
            if (timer) return;
            timer = setInterval(async () => render(await getState()), 400);
        }
        function stopPoll() {
            if (timer) clearInterval(timer);
            timer = null;
        }

        document.getElementById("closeDrawer").onclick = closeDrawer;
        document.getElementById("backdrop").onclick = closeDrawer;
        document.getElementById("q").oninput = () => render(lastState);
        document.getElementById("sortBy").onchange = () => render(lastState);
        document.getElementById("levelFilter").onchange = () => render(lastState);

        document.addEventListener("keydown", (e) => {
            if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
            if (e.key === "Escape") closeDrawer();
            if (e.key === "s" || e.key === "S") document.getElementById("scanBtn").click();
            if (e.key === "d" || e.key === "D") document.getElementById("demoBtn").click();
        });

        document.getElementById("demoBtn").onclick = async () => {
            document.getElementById("err").textContent = "";
            await fetch("/api/demo", { method: "POST" });
            render(await getState());
        };

        document.getElementById("scanBtn").onclick = async () => {
            document.getElementById("err").textContent = "";
            const cidr = document.getElementById("cidr").value.trim();
            const authorized = document.getElementById("auth").checked;
            const r = await fetch("/api/scan", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cidr, authorized }),
            });
            const data = await r.json();
            if (!r.ok) {
                document.getElementById("err").textContent = data.error || "scan blocked";
                return;
            }
            startPoll();
            render(await getState());
        };

        document.getElementById("cancelBtn").onclick = async () => {
            await fetch("/api/cancel", { method: "POST" });
            render(await getState());
        };

        async function boot() {
            await fetch("/api/clear", { method: "POST" });
            render(await getState());
        }
        boot();
    </script>
</body>

</html>
